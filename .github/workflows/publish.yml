name: Publish Extension

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-dir: '18.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package & Publish
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
